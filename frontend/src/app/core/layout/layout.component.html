<mat-sidenav-container class="shell">
  <!-- ── Sidebar ──────────────────────────────────────────── -->
  <mat-sidenav
    #drawer
    class="sidenav"
    [mode]="isHandset ? 'over' : 'side'"
    [opened]="!isHandset"
  >
    <div class="sidenav-header">
      <img src="assets/logo.svg" alt="Zig's Codex" class="brand-logo">
    </div>

    <mat-nav-list class="nav-list">
      @for (item of navItems; track item.route) {
        <a
          mat-list-item
          [routerLink]="item.route"
          routerLinkActive="nav-active"
          (click)="isHandset && drawer.close()"
        >
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>

    <!-- ── Sidebar footer ────────────────────────────────── -->
    <div class="sidenav-footer">
      @if (auth.currentUser()) {
        <span class="user-name">{{ auth.currentUser()!.name }}</span>
      }
      <div class="footer-actions">
        <button mat-icon-button (click)="theme.toggle()"
                [matTooltip]="theme.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
                class="theme-btn">
          <mat-icon>{{ theme.isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
        </button>
        <button mat-icon-button (click)="auth.logout()" matTooltip="Sign out" class="logout-btn">
          <mat-icon>logout</mat-icon>
        </button>
      </div>
    </div>
  </mat-sidenav>

  <!-- ── Main content ─────────────────────────────────────── -->
  <mat-sidenav-content class="main">
    @if (isHandset) {
      <mat-toolbar class="mobile-bar">
        <button mat-icon-button (click)="drawer.toggle()" aria-label="Toggle menu">
          <mat-icon>menu</mat-icon>
        </button>
        <img src="assets/logo.svg" alt="Zig's Codex" class="brand-logo-mobile">
      </mat-toolbar>
    }

    <div class="page-content">
      <router-outlet />
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
