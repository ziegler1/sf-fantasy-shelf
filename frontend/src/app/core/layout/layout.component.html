<mat-sidenav-container class="shell">
  <!-- ── Sidebar ──────────────────────────────────────────── -->
  <mat-sidenav
    #drawer
    class="sidenav"
    [mode]="isHandset ? 'over' : 'side'"
    [opened]="!isHandset"
  >
    <div class="sidenav-header">
      <mat-icon class="brand-icon">auto_stories</mat-icon>
      <span class="brand-name">SF Fantasy Shelf</span>
    </div>

    <mat-nav-list class="nav-list">
      @for (item of navItems; track item.route) {
        <a
          mat-list-item
          [routerLink]="item.route"
          routerLinkActive="nav-active"
          (click)="isHandset && drawer.close()"
        >
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>

    <!-- ── Sidebar footer ────────────────────────────────── -->
    <div class="sidenav-footer">
      @if (auth.currentUser()) {
        <span class="user-name">{{ auth.currentUser()!.name }}</span>
      }
      <button mat-icon-button (click)="auth.logout()" matTooltip="Sign out" class="logout-btn">
        <mat-icon>logout</mat-icon>
      </button>
    </div>
  </mat-sidenav>

  <!-- ── Main content ─────────────────────────────────────── -->
  <mat-sidenav-content class="main">
    @if (isHandset) {
      <mat-toolbar class="mobile-bar">
        <button mat-icon-button (click)="drawer.toggle()" aria-label="Toggle menu">
          <mat-icon>menu</mat-icon>
        </button>
        <span class="brand-name">SF Fantasy Shelf</span>
      </mat-toolbar>
    }

    <div class="page-content">
      <router-outlet />
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
