<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">
      <mat-icon class="brand-icon">auto_stories</mat-icon>
      <h1 class="brand-name">Zig's Codex</h1>
    </div>

    <h2 class="auth-heading">Sign in</h2>

    @if (notice) {
      <p class="auth-notice">{{ notice }}</p>
    }

    <mat-form-field appearance="outline" class="auth-field">
      <mat-label>Email</mat-label>
      <input matInput type="email" [(ngModel)]="email" (keydown.enter)="submit()" autocomplete="email">
      <mat-icon matSuffix>mail</mat-icon>
    </mat-form-field>

    <mat-form-field appearance="outline" class="auth-field">
      <mat-label>Password</mat-label>
      <input matInput [type]="hidePassword ? 'password' : 'text'"
             [(ngModel)]="password" (keydown.enter)="submit()" autocomplete="current-password">
      <button mat-icon-button matSuffix (click)="hidePassword = !hidePassword" type="button">
        <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
    </mat-form-field>

    @if (error) {
      <p class="auth-error">{{ error }}</p>
    }

    <button mat-flat-button color="primary" class="auth-btn" (click)="submit()" [disabled]="loading">
      @if (loading) { <mat-spinner diameter="20" /> } @else { Sign in }
    </button>

    <div class="auth-links">
      <a routerLink="/forgot-password" class="forgot-link">Forgot password?</a>
      <span class="auth-sep">·</span>
      <a routerLink="/register">Create account</a>
    </div>
  </div>
</div>

<style>
.auth-page {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #0f172a;
  padding: 1rem;
}

.auth-card {
  width: 100%;
  max-width: 380px;
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

.auth-brand {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin-bottom: 1rem;
}

.brand-icon {
  color: #60a5fa;
  font-size: 1.75rem;
  width: 1.75rem;
  height: 1.75rem;
}

.brand-name {
  font-size: 1.2rem;
  font-weight: 700;
  color: #e2e8f0;
  margin: 0;
}

.auth-heading {
  font-size: 1.5rem;
  font-weight: 700;
  color: #f1f5f9;
  margin: 0 0 0.5rem;
}

.auth-field { width: 100%; }

.auth-notice {
  color: #34d399;
  font-size: 0.82rem;
  margin: 0;
  padding: 0.5rem 0.75rem;
  background: rgba(52, 211, 153, 0.1);
  border-radius: 6px;
  border: 1px solid rgba(52, 211, 153, 0.2);
}

.auth-error {
  color: #f87171;
  font-size: 0.82rem;
  margin: 0;
}

.auth-btn {
  width: 100%;
  height: 44px;
  font-size: 0.95rem;
}

.auth-links {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 0.4rem;
  font-size: 0.82rem;
  color: #475569;
  margin: 0.25rem 0 0;
}

.auth-links a {
  color: #60a5fa;
  text-decoration: none;
}

.auth-links a:hover { text-decoration: underline; }

.auth-sep { color: #334155; }
</style>
